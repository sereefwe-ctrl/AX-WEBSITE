<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AttentionX</title>
  <link rel="icon" type="image/png" href="images/Logo1.png" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #0e0e0d;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }

    /* Tall paper card in the middle of the page. Width is capped so the
       whole card still fits in short viewports. */
    .card {
      position: relative;
      z-index: 1;
      width: min(380px, 100%, calc((100vh - 96px) * 0.68));
      aspect-ratio: 0.68;
      border-radius: 16px;
      background-color: #f2efe8;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    }

    /* Live film grain, redrawn by the script below. */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.11;
    }
  </style>
</head>
<body>
  <main class="card"></main>

  <canvas class="grain" aria-hidden="true"></canvas>

  <script>
    // Live film grain: a few pre-rendered noise tiles, shown at a random
    // offset ~14 times a second so the grain flickers like film.
    (function () {
      var canvas = document.querySelector('.grain');
      var ctx = canvas.getContext('2d');
      var TILE = 180;
      var tiles = [];

      for (var t = 0; t < 6; t++) {
        var c = document.createElement('canvas');
        c.width = c.height = TILE;
        var cx = c.getContext('2d');
        var img = cx.createImageData(TILE, TILE);
        for (var i = 0; i < img.data.length; i += 4) {
          var v = (Math.random() * 255) | 0;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        cx.putImageData(img, 0, 0);
        tiles.push(ctx.createPattern(c, 'repeat'));
      }

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
      }

      function draw() {
        var p = tiles[(Math.random() * tiles.length) | 0];
        var ox = (Math.random() * TILE) | 0, oy = (Math.random() * TILE) | 0;
        ctx.setTransform(1, 0, 0, 1, -ox, -oy);
        ctx.fillStyle = p;
        ctx.fillRect(ox, oy, canvas.width, canvas.height);
      }

      resize();
      window.addEventListener('resize', resize);

      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      setInterval(draw, 70);
    })();
  </script>
</body>
</html>
