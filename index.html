<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AttentionX</title>
  <link rel="icon" type="image/png" href="images/Logo1.png" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gap: clamp(14px, 2.2vw, 44px);
      --radius: clamp(14px, 1.4vw, 28px);
      --glass-edge: rgba(255, 255, 255, 0.09);
    }

    body {
      background-color: #0e0e0d;
      overflow-x: hidden;
    }

    /* Slow-moving light behind the glass so the tiles have something to blur. */
    .ambient {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient span {
      position: absolute;
      width: 70vmax;
      height: 70vmax;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      will-change: transform;
    }

    .ambient .a {
      top: -25vmax;
      left: -20vmax;
      background: radial-gradient(circle, rgba(159, 180, 230, 0.32), transparent 65%);
      animation: drift-a 38s ease-in-out infinite alternate;
    }

    .ambient .b {
      bottom: -30vmax;
      right: -25vmax;
      background: radial-gradient(circle, rgba(232, 162, 124, 0.26), transparent 65%);
      animation: drift-b 46s ease-in-out infinite alternate;
    }

    .ambient .c {
      top: 30%;
      left: 35%;
      width: 45vmax;
      height: 45vmax;
      background: radial-gradient(circle, rgba(255, 200, 87, 0.12), transparent 65%);
      animation: drift-c 54s ease-in-out infinite alternate;
    }

    @keyframes drift-a { to { transform: translate(30vw, 25vh) scale(1.15); } }
    @keyframes drift-b { to { transform: translate(-35vw, -30vh) scale(0.9); } }
    @keyframes drift-c { to { transform: translate(-25vw, 20vh) scale(1.3); } }

    @media (prefers-reduced-motion: reduce) {
      .ambient span { animation: none; }
    }

    .bento {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      padding: var(--gap);
    }

    /* Frosted-glass tile with a soft highlight that follows the pointer. */
    .tile {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.015) 55%, rgba(255, 255, 255, 0.03));
      border: 1px solid var(--glass-edge);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 30px 60px -40px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
    }

    .tile::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, 0.08), transparent 60%);
    }

    .tile:hover::before {
      opacity: 1;
    }

    /* Row 1: hero panel, fills the first screen. */
    .hero {
      height: calc(100vh - 2 * var(--gap));
      height: calc(100svh - 2 * var(--gap));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Same footprint as the Stealth Fund hero logo. */
    .hero-logo {
      display: block;
      width: min(640px, 70%);
      height: auto;
      user-select: none;
    }

    /* Live film grain, redrawn by the script below. */
    .grain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.11;
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span></div>

  <main class="bento">
    <section class="tile hero">
      <img class="hero-logo" src="images/attentionx-logo.png" alt="AttentionX" />
    </section>
  </main>

  <canvas class="grain" aria-hidden="true"></canvas>

  <script>
    // Live film grain: a few pre-rendered noise tiles, shown at a random
    // offset ~14 times a second so the grain flickers like film.
    (function () {
      var canvas = document.querySelector('.grain');
      var ctx = canvas.getContext('2d');
      var TILE = 180;
      var tiles = [];

      for (var t = 0; t < 6; t++) {
        var c = document.createElement('canvas');
        c.width = c.height = TILE;
        var cx = c.getContext('2d');
        var img = cx.createImageData(TILE, TILE);
        for (var i = 0; i < img.data.length; i += 4) {
          var v = (Math.random() * 255) | 0;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        cx.putImageData(img, 0, 0);
        tiles.push(ctx.createPattern(c, 'repeat'));
      }

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
      }

      function draw() {
        var p = tiles[(Math.random() * tiles.length) | 0];
        var ox = (Math.random() * TILE) | 0, oy = (Math.random() * TILE) | 0;
        ctx.setTransform(1, 0, 0, 1, -ox, -oy);
        ctx.fillStyle = p;
        ctx.fillRect(ox, oy, canvas.width, canvas.height);
      }

      resize();
      window.addEventListener('resize', resize);

      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      setInterval(draw, 70);
    })();

    document.querySelectorAll('.tile').forEach(function (tile) {
      tile.addEventListener('mousemove', function (e) {
        var r = tile.getBoundingClientRect();
        tile.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        tile.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
    });
  </script>
</body>
</html>
